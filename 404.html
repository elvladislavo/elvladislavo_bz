<!-- ─────────────────────────────────────────────────────────────────────
     This page is deliberately self-contained: no stylesheet, script,
     favicon or image of its own. A host serves 404.html for ANY missing
     URL, at any depth (/a/b/c/typo), so relative paths would resolve
     against the wrong folder and absolute ones break in a subdirectory.
     Inlining everything means it renders correctly wherever it's served.
     ───────────────────────────────────────────────────────────────── -->
<style>
:root{
  --ink:#0A0A0B; --bone:#EFEAE1; --red:#FF2E1F; --lime:#C8FF3D;
  --mut:rgba(239,234,225,.58); --hair:rgba(239,234,225,.14);
  --f-sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:clamp(1.25rem,4.4vw,5rem); --nav-h:clamp(64px,7vw,88px);
  --e:cubic-bezier(.22,1,.36,1); --e-snap:cubic-bezier(.16,1.02,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
body{
  background:var(--ink); color:var(--bone); font-family:var(--f-sans);
  font-size:clamp(1rem,.95rem + .2vw,1.125rem); line-height:1.55;
  overflow-x:hidden; overflow-x:clip;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none}
button{background:none;border:0;cursor:pointer;font:inherit;color:inherit}
::selection{background:var(--red);color:var(--bone)}
:focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:2px}


.nav{
  position:fixed; top:0; left:0; right:0; z-index:150; height:var(--nav-h);
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; padding-inline:var(--gut);
  background:color-mix(in srgb,var(--ink) 72%,transparent);
  backdrop-filter:blur(16px) saturate(1.3);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid var(--hair);
}
.nav__logo{display:inline-flex;align-items:center;gap:.62rem;font-weight:800;
  letter-spacing:-.035em;font-size:clamp(1rem,1.35vw,1.2rem)}
.nav__word{font-variation-settings:"wdth" 100;transition:font-variation-settings .55s var(--e)}
.nav__logo:hover .nav__word{font-variation-settings:"wdth" 88}

.lang{display:inline-flex;align-items:center;gap:.1rem}
.lang__btn{font:700 .78rem/1 var(--f-mono);letter-spacing:.1em;color:var(--mut);
  padding:.8rem .55rem;position:relative;transition:color .3s var(--e)}
.lang__btn::after{content:"";position:absolute;left:.55rem;right:.55rem;bottom:.7rem;
  height:1px;background:var(--red);transform:scaleX(0);transform-origin:right;
  transition:transform .4s var(--e)}
.lang__btn:hover{color:var(--bone)}
.lang__btn:hover::after,.lang__btn.is-on::after{transform:scaleX(1);transform-origin:left}
.lang__btn.is-on{color:var(--bone)}
.lang__sep{color:rgba(239,234,225,.28);font:400 .78rem/1 var(--f-mono);pointer-events:none}

.label{display:inline-flex;align-items:center;gap:.8rem;
  font:400 clamp(.66rem,.9vw,.78rem)/1 var(--f-mono);
  letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.label i{font-style:normal;color:var(--red);font-weight:700;
  padding-right:.8rem;border-right:1px solid var(--hair)}

.btn{
  --btn-bg:var(--red);
  position:relative;display:inline-flex;align-items:center;gap:.8rem;
  padding:clamp(.95rem,1.5vw,1.2rem) clamp(1.5rem,2.4vw,2rem);
  font:700 clamp(.82rem,.95vw,.95rem)/1 var(--f-sans);
  border:1px solid transparent;overflow:hidden;isolation:isolate;
  transition:color .35s var(--e),border-color .35s var(--e);
}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--btn-bg);
  transform:translateY(0);transition:transform .5s var(--e)}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--bone);
  transform:translateY(101%);transition:transform .5s var(--e)}
.btn:hover::after,.btn:focus-visible::after{transform:translateY(0)}
.btn:hover::before,.btn:focus-visible::before{transform:translateY(-101%)}
.btn--fill{color:var(--bone)}
.btn--fill:hover,.btn--fill:focus-visible{color:var(--ink)}
.btn--ghost{--btn-bg:transparent;border-color:var(--hair);color:var(--bone)}
.btn--ghost:hover,.btn--ghost:focus-visible{color:var(--ink);border-color:var(--bone)}
.btn__t,.btn__a{position:relative;z-index:1}
.btn__a{display:inline-block;transition:transform .45s var(--e-snap)}
.btn:hover .btn__a{transform:translateX(.35rem)}

.err{
  position:relative;min-height:100svh;
  display:grid;align-content:center;gap:1.4rem;
  padding:calc(var(--nav-h) + 3rem) var(--gut) 4rem;
  max-width:1560px;margin-inline:auto;overflow:hidden;
}
.err__code{
  font-size:clamp(5.5rem,26vw,20rem);font-weight:900;line-height:.8;
  letter-spacing:-.06em;color:transparent;
  -webkit-text-stroke:1px rgba(239,234,225,.22);
  margin:.2em 0 .1em;
}
.err__code b{color:var(--red);-webkit-text-stroke:0;font-weight:900}
.err h1{font-size:clamp(1.9rem,5.4vw,3.6rem);font-weight:800;line-height:.95;
  letter-spacing:-.04em;max-width:16ch;text-wrap:balance}
.err h1 em{font-family:var(--f-serif);font-style:italic;font-weight:400;
  color:var(--red);font-size:1.06em}
.err p{color:var(--mut);max-width:46ch}
.err__acts{display:flex;flex-wrap:wrap;align-items:flex-start;gap:.8rem;margin-top:1.2rem}

@media (max-width:640px){
  .err__acts .btn{flex:1 1 auto;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}

/* Reaction background — mirrors section 17 of css/style.css, inlined
   because this page ships without the stylesheet. */
#bz{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--ink);contain:strict}
#bz .bz__c{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;
  transition:opacity 1.4s var(--e)}
#bz.is-on .bz__c{opacity:.3}
#bz::after{content:"";position:absolute;inset:0;
  background:radial-gradient(135% 95% at 50% 32%,rgba(10,10,11,.30) 0%,rgba(10,10,11,.52) 48%,rgba(10,10,11,.72) 100%)}
.err{position:relative;z-index:1}
@media (prefers-reduced-motion: reduce){#bz .bz__c{transition:none}}
</style>

<script>
(function () {
  var d = document.documentElement;
  d.className = d.className.replace('no-js', 'js');
  var l = null;
  try { l = localStorage.getItem('elv-lang'); } catch (e) {}
  if (l !== 'pl' && l !== 'en') l = /^pl\b/i.test(navigator.language || '') ? 'pl' : 'en';
  d.lang = l;
})();
</script>
</head>
<body>

<div id="bz" aria-hidden="true"></div>


<header class="nav">
  <a class="nav__logo" id="homeLogo" href="/" aria-label="elvladislavo — home">
    <span class="nav__word">elvladislavo</span>
  </a>
  <div class="lang" role="group" aria-label="Language / Język">
    <button type="button" class="lang__btn" data-lang="pl">PL</button>
    <span class="lang__sep" aria-hidden="true">|</span>
    <button type="button" class="lang__btn" data-lang="en">EN</button>
  </div>
</header>

<main class="err">

  <p class="label"><i aria-hidden="true">404</i><span data-t="kicker">Nie znaleziono strony</span></p>
  <div class="err__code" aria-hidden="true">4<b>0</b>4</div>
  <h1 data-t-html="head">Ta strona <em>zniknęła</em>.</h1>
  <p data-t="body">Link jest nieprawidłowy albo strona została przeniesiona. Wszystko, co warto zobaczyć, jest na stronie głównej.</p>

  <div class="err__acts">
    <a class="btn btn--fill" id="homeBtn" href="/">
      <span class="btn__t" data-t="cta1">Wróć na stronę główną</span><span class="btn__a" aria-hidden="true">→</span>
    </a>
    <a class="btn btn--ghost" id="contactBtn" href="/#contact">
      <span class="btn__t" data-t="cta2">Napisz do mnie</span><span class="btn__a" aria-hidden="true">→</span>
    </a>
  </div>
</main>

<script>
(function () {
  /* ── Where does the home page live? ────────────────────────────────
     A host serves this file for any missing URL, so the page can't tell
     its own folder from the address bar. At a domain root that's just
     "/". On a GitHub Pages *project* site it's "/<repo>/", which the
     auto-detect below handles.

     If your site sits in some other subfolder, replace null with that
     path — e.g. '/elvladislavo/'. That one line is the only edit needed. */
  var SITE_ROOT_OVERRIDE = null;

  var SITE_ROOT = SITE_ROOT_OVERRIDE || (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/i.test(location.hostname) && seg.length > 1) return '/' + seg[0] + '/';
    return '/';
  })();

  document.getElementById('homeLogo').href = SITE_ROOT;
  document.getElementById('homeBtn').href = SITE_ROOT;
  document.getElementById('contactBtn').href = SITE_ROOT + '#contact';

  var T = {
    en: { kicker: 'Page not found',
          head: 'This page went <em>missing</em>.',
          body: 'The link is broken or the page has moved. Everything worth seeing is on the home page.',
          cta1: 'Back to home', cta2: 'Get in touch',
          title: '404 — Page not found · elvladislavo' },
    pl: { kicker: 'Nie znaleziono strony',
          head: 'Ta strona <em>zniknęła</em>.',
          body: 'Link jest nieprawidłowy albo strona została przeniesiona. Wszystko, co warto zobaczyć, jest na stronie głównej.',
          cta1: 'Wróć na stronę główną', cta2: 'Napisz do mnie',
          title: '404 — Nie znaleziono strony · elvladislavo' }
  };

  function apply(l, remember) {
    var d = T[l] || T.en;
    document.documentElement.lang = l;
    document.title = d.title;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = d[el.dataset.t]; });
    document.querySelectorAll('[data-t-html]').forEach(function (el) { el.innerHTML = d[el.dataset.tHtml]; });
    document.querySelectorAll('.lang__btn').forEach(function (b) {
      var on = b.dataset.lang === l;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (remember) { try { localStorage.setItem('elv-lang', l); } catch (e) {} }
  }

  document.querySelectorAll('.lang__btn').forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.lang, true); });
  });
  apply(document.documentElement.lang === 'pl' ? 'pl' : 'en');
})();
</script>
<script src="js/bz.js" defer></script>
</body>
